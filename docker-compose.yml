services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: webaayo
      MONGO_INITDB_ROOT_PASSWORD: change-me-local-only
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://webaayo:change-me-local-only@mongodb:27017/web_aayo?authSource=admin
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    ports: ["3000:3000"]
    depends_on: [backend]

  admin:
    build: ./admin
    restart: unless-stopped
    env_file: ./admin/.env
    ports: ["3001:3001"]
    depends_on: [backend]

volumes:
  mongo_data:
  redis_data:
